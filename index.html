:root{--bg:#fcf8e6;--card:#fff;--tx:#1c2b22;--mu:#6b7a70;--bd:#e6dfbd;--hd:#1f5a3a;--hdt:#f7e9ab;--bt:#1f5a3a;--btt:#fff;--ac:#1f5a3a;--y:#f7e9ab;--rd:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f2a1c;--card:#17382a;--tx:#f6efcf;--mu:#b9c4b0;--bd:#2c5440;--hd:#0a1f14;--bt:#f7e9ab;--btt:#143d27;--ac:#f7e9ab;--y:#2c5440;--rd:#ff8a80}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:var(--hd);color:var(--hdt);display:flex;align-items:center;gap:12px;padding:12px 16px}
header img{width:46px;height:46px}header h1{font-size:17px;margin:0}header small{opacity:.85}header svg{width:54px}
header button{margin-left:auto;border:1px solid var(--hdt);background:transparent;color:var(--hdt);border-radius:99px;padding:6px 12px;font:inherit;cursor:pointer}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:var(--y)}
nav button{white-space:nowrap;border:0;border-radius:99px;padding:7px 13px;background:transparent;color:var(--tx);font:inherit;cursor:pointer}nav button.on{background:var(--bt);color:var(--btt)}
main{max-width:1100px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}.card h3{margin:0 0 8px;font-size:16px;color:var(--ac)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.cg{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin-bottom:14px}.cg .card{margin:0}.cv{position:relative;height:230px}
.st{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}.st b{display:block;font-size:21px;color:var(--ac)}.st span{color:var(--mu);font-size:13px}
.tb{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;align-items:center}
.tb button,.card>button{border:0;background:var(--bt);color:var(--btt);border-radius:9px;padding:8px 12px;font:inherit;cursor:pointer}.tb button.o,.card>button.o{background:transparent;color:var(--ac);border:1px solid var(--ac)}
input,select{font:inherit;padding:8px 10px;border:1px solid var(--bd);border-radius:9px;background:var(--card);color:var(--tx);max-width:100%}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th{background:var(--y);color:var(--tx);text-align:left;white-space:nowrap}th,td{padding:7px 9px;border-bottom:1px solid var(--bd)}
td button{border:0;background:transparent;cursor:pointer;font-size:15px}#f_nama,#f_pelaku{text-transform:uppercase}td[contenteditable]:hover{background:var(--y)}td[contenteditable]:focus{outline:2px solid var(--ac);background:var(--y)}
.tg{padding:2px 8px;border-radius:99px;font-size:12px;background:var(--y);color:var(--tx)}.tg.r{background:var(--rd);color:#fff}
#m{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:16px;z-index:9}#m.on{display:flex}
#m form{background:var(--card);border-radius:16px;padding:16px;width:100%;max-width:420px;max-height:90%;overflow:auto}#m label{display:block;font-size:13px;color:var(--mu);margin-top:8px}#m input,#m select{width:100%}
#t{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--hd);color:var(--hdt);padding:9px 16px;border-radius:99px;display:none;z-index:10}
.em{text-align:center;color:var(--mu);padding:14px}.mu{color:var(--mu);font-size:13px}ol{padding-left:20px}
